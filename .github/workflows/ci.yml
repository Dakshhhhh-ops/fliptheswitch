name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and judge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/doctor.mjs || true
      - run: npm test
      - run: npm run judge
      - name: Live-run certificates against the agents' git
        run: |
          node tools/certificate.mjs verify docs/live-run/F1.cert.json --tests
          node tools/certificate.mjs verify docs/live-run/F5.cert.json --tests

  old-node:
    name: Older Node stops early with the fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm run judge on Node 22 refuses, naming Node 24.7
        run: |
          if npm run -s judge 2> err.txt; then echo "judge ran on Node 22"; exit 1; fi
          cat err.txt
          grep -q "needs Node 24.7 or later" err.txt

  web:
    name: Desk app builds and exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run setup
      - run: npm run export
      - name: The snapshot has the six findings
        run: node -e "const d=require('./web/dist-static/api/desk.json'); const n=(d.rows??d.findings??[]).length; console.log(n,'findings'); process.exit(n===6?0:1)"

  crypto-scan:
    name: Quantum-vulnerable crypto scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # demo-payments has planted findings on purpose, so this scan reports
      # them in code scanning but never fails the build.
      - name: Scan demo-payments
        run: node tools/cbom-scan.mjs demo-payments --out cbom.json --sarif cbom-scan.sarif --fail-on none

      # On a real codebase, commit a baseline once
      #   node tools/cbom-scan.mjs . --baseline crypto-baseline.json
      # and then let CI block only crypto that is new since then:
      # - name: Crypto gate
      #   run: node tools/cbom-scan.mjs . --baseline crypto-baseline.json --fail-on p1

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        # Forks and private repos without code scanning can't accept uploads.
        continue-on-error: true
        with:
          sarif_file: cbom-scan.sarif
          category: cbom-scan

      - name: Keep the CBOM
        uses: actions/upload-artifact@v4
        with:
          name: cbom
          path: |
            cbom.json
            cbom-scan.sarif
